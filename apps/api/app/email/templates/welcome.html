<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Welcome to Learnly</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #f7f9fa; margin: 0; padding: 0; }
    .wrap { max-width: 560px; margin: 40px auto; background: #fff; border-radius: 8px; overflow: hidden; border: 1px solid #d1d7dc; }
    .header { background: #a435f0; padding: 28px 32px; }
    .header h1 { color: #fff; margin: 0; font-size: 22px; }
    .body { padding: 32px; }
    .body p { color: #1c1d1f; line-height: 1.6; margin: 0 0 16px; }
    .btn { display: inline-block; background: #a435f0; color: #fff; text-decoration: none; padding: 12px 24px; border-radius: 4px; font-weight: 600; font-size: 14px; }
    .footer { padding: 20px 32px; border-top: 1px solid #d1d7dc; }
    .footer p { color: #6a6f73; font-size: 12px; margin: 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <h1>Welcome to Learnly!</h1>
    </div>
    <div class="body">
      <p>Hi {{ first_name }},</p>
      <p>We&rsquo;re glad you&rsquo;re here. Start exploring thousands of courses and level up your skills today.</p>
      <a href="{{ app_url }}/courses" class="btn">Browse courses</a>
    </div>
    <div class="footer">
      <p>&copy; 2025 Learnly. All rights reserved.</p>
    </div>
  </div>
</body>
</html>
