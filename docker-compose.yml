services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: learnly_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learnly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnly_dev}
      POSTGRES_DB: ${POSTGRES_DB:-learnly}
    ports:
      - "5432:5432"
    volumes:
      - .docker-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learnly}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: learnly_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - .docker-data/redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: learnly_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-learnly}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-learnly_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - .docker-data/minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  meilisearch:
    image: getmeili/meilisearch:latest
    container_name: learnly_meilisearch
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-learnly_meili_dev}
      MEILI_ENV: development
    ports:
      - "7700:7700"
    volumes:
      - .docker-data/meilisearch:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:7700/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mailhog:
    image: mailhog/mailhog:latest
    container_name: learnly_mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  judge0-server:
    image: judge0/judge0:1.13.1
    container_name: learnly_judge0_server
    restart: unless-stopped
    ports:
      - "2358:2358"
    environment:
      RAILS_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-learnly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnly_dev}
      POSTGRES_DB: judge0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKERS_NUMBER: 2
      ENABLE_WAIT_RESULT: "true"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    privileged: true
    cgroup: host

  judge0-worker:
    image: judge0/judge0:1.13.1
    container_name: learnly_judge0_worker
    restart: unless-stopped
    command: ["./scripts/workers"]
    environment:
      RAILS_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER:-learnly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-learnly_dev}
      POSTGRES_DB: judge0
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKERS_NUMBER: 2
    depends_on:
      - judge0-server
    privileged: true
    cgroup: host

  livekit:
    image: livekit/livekit-server:latest
    container_name: learnly_livekit
    restart: unless-stopped
    ports:
      - "7880:7880"
      - "7881:7881/tcp"
    volumes:
      - ./livekit.yaml:/livekit.yaml
    command: ["--config", "/livekit.yaml"]
